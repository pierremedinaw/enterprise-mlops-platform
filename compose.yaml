services:
  trainer:
    build: .
    # La salida del entrenamiento persiste en el equipo local.
    command: python -m mlops_platform.train
    volumes:
      - ./artifacts:/app/artifacts
      - ./mlruns:/app/mlruns

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_PATH: /app/artifacts/model.joblib
    volumes:
      - ./artifacts:/app/artifacts:ro
