[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-mlops-platform"
version = "0.1.0"
description = "MVP reproducible de MLOps con MLflow, FastAPI y CI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Pierre Anthony Medina" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "uvicorn>=0.30,<1.0",
    "scikit-learn>=1.5,<1.7",
    "numpy>=1.26,<2.1",
    "pandas>=2.2,<3.0",
    "mlflow>=2.20,<3.0",
    "joblib>=1.4,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
